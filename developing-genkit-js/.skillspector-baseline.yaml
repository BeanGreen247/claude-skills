# SkillSpector baseline — reviewed false positives, suppressed on future scans.
# Regenerate with: skill-safety-review/scan-skills.sh --accept
version: 2
scanner_version: 2.11.0
rules:
# Hand-authored, drift-tolerant. AE1/RP1 fire per-line on null patterns and
# cannot be re-fingerprinted reliably. Reviewed 20260909 — all benign:
# markdown-only skill, no scripts, no network egress.
- id: "AE1"
  path: "*"
  reason: "'self-terminating / runs once then exits / non-interactive check' is prose describing the `genkit flow:run` CLI lifecycle, not sandbox-evasion"
- id: "RP1"
  path: "*"
  reason: "Hits on ordinary `genkit start -- ...`, `genkit flow:run`, `genkit docs:search` and doc-link lines; no MCP server involved"
- id: "EA2"
  path: "*"
  reason: "Skill teaches building AI agents; 'autonomous decision making' prose is the subject matter, not a directive to the host agent"
fingerprints: []
